<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravelSync - Início</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="layout-geral">
      <aside class="menu-lateral">
        <button class="fechar-menu" type="button" aria-label="Fechar menu">×</button>
        <button class="logo-menu" type="button" data-view="destinos" aria-label="TravelSync">
          <img src="../assets/imagem/logotravelsync.png" alt="TravelSync" />
        </button>

         <nav class="menu" aria-label="Menu principal">
          <a href="index.html"><button class="item-menu" type="button" data-view="inicio"><span class="icone">⌂</span>Inicio</button></a>
          <a href="destinos.html"><button class="item-menu ativo" type="button" data-view="destinos"><span class="icone">⌖</span>Destinos</button></a>
          <a href="minimapa.html"><button class="item-menu" type="button" data-view="grupo"><span class="icone">♙</span>Mini mapa</button></a>
          <a href="cadastro_locais.html"><button class="item-menu" type="button" data-view="planejar"><span class="icone">□</span>Cadastro de locais</button></a>
          <a href="#" onclick="mostrarFavoritos(event)" ><button class="item-menu" type="button" data-view="favoritos"><span class="icone">♡</span>Favoritos <b id="totalFavoritos">0</b></button></a>
          <a href="historico.html"><button class="item-menu" type="button" data-view="historico"><span class="icone">◷</span>Historico</button></a>
          <a href="perfil.html"><button class="item-menu" type="button" data-view="perfil"><span class="icone">♙</span>Meu perfil</button></a>
          <button class="item-menu" type="button" data-view="sair" id="btnSair"><span class="icone">↪</span>Sair</button>
        </nav>
      </aside>
      <div class="fundo-menu" aria-hidden="true"></div>

      <div class="area-pagina">
        <header class="cabecalho">
          <button class="botao-menu" type="button" aria-label="Abrir menu">☰</button>
          <button class="logo-cabecalho" type="button" data-view="destinos" aria-label="TravelSync">
            <img src="../assets/imagem/logotravelsync.png" alt="TravelSync" />
          </button>
          <label class="busca-topo">
            <span>⌕</span>
            <input id="buscaTopo" type="search" placeholder="Buscar destinos, atracoes, dicas..." />
          </label>
          <div class="acoes-topo">
            <button class="botao-icone" aria-label="Notificacoes">♢</button>
            <button class="botao-icone" aria-label="Mensagens">✉</button>
              <div class="perfil-topo">
                <span class="foto-perfil"></span>
                <span><a href="login.html">Olá, Usuário!</a></span>
                <span></span>
              </div>
          </div>
        </header>
    <div class="perfil-container">

    <h1>Editar Perfil</h1>

    <div class="foto-preview">
      <img id="fotoPreview" src="https://via.placeholder.com/120" alt="Foto do perfil">
    </div>

    <form id="formPerfil">

      <label>Nome</label>
      <input type="text" id="nome" placeholder="Seu nome">

      <label>Email</label>
      <input type="email" id="email" placeholder="Seu email">

      <label>URL da Foto</label>
      <input type="text" id="foto" placeholder="https://...">

      <label>Bio</label>
      <textarea id="bio" placeholder="Fale sobre você..."></textarea>

      <button type="submit">Salvar alterações</button>

    </form>

    <p id="msg"></p>

  </div>


        <footer class="rodape">
          <span>© 2024 Travel Sync</span>
          <a href="#">Sobre</a>
          <a href="#">Contato</a>
          <a href="#">Termos de uso</a>
          <a href="#">Privacidade</a>
          <div class="redes-sociais" aria-label="Redes sociais">
            <span>◎</span>
            <span>●</span>
            <span>◆</span>
          </div>
        </footer>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/perfil.js"></script>
  </body>
</html>
