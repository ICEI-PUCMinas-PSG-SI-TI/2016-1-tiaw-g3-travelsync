<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravelSync - Início</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="layout-geral">
      <aside class="menu-lateral">
        <button class="fechar-menu" type="button" aria-label="Fechar menu">×</button>
        <button class="logo-menu" type="button" data-view="destinos" aria-label="TravelSync">
          <img src="../assets/imagem/logotravelsync.png" alt="TravelSync" />
        </button>

         <nav class="menu" aria-label="Menu principal">
          <a href="index.html"><button class="item-menu" type="button" data-view="inicio"><span class="icone">⌂</span>Inicio</button></a>
          <a href="destinos.html"><button class="item-menu ativo" type="button" data-view="destinos"><span class="icone">⌖</span>Destinos</button></a>
          <a href="minimapa.html"><button class="item-menu" type="button" data-view="grupo"><span class="icone">♙</span>Mini mapa</button></a>
          <a href="cadastro_locais.html"><button class="item-menu" type="button" data-view="planejar"><span class="icone">□</span>Cadastro de locais</button></a>
          <a href="#" onclick="mostrarFavoritos(event)" ><button class="item-menu" type="button" data-view="favoritos"><span class="icone">♡</span>Favoritos <b id="totalFavoritos">0</b></button></a>
          <a href="historico.html"><button class="item-menu" type="button" data-view="historico"><span class="icone">◷</span>Historico</button></a>
          <a href="perfil.html"><button class="item-menu" type="button" data-view="perfil"><span class="icone">♙</span>Meu perfil</button></a>
          <button class="item-menu" type="button" data-view="sair" id="btnSair"><span class="icone">↪</span>Sair</button>
        </nav>
      </aside>
      <div class="fundo-menu" aria-hidden="true"></div>

      <div class="area-pagina">
        <header class="cabecalho">
          <button class="botao-menu" type="button" aria-label="Abrir menu">☰</button>
          <button class="logo-cabecalho" type="button" data-view="destinos" aria-label="TravelSync">
            <img src="../assets/imagem/logotravelsync.png" alt="TravelSync" />
          </button>
          <label class="busca-topo">
            <span>⌕</span>
            <input id="buscaTopo" type="search" placeholder="Buscar destinos, atracoes, dicas..." />
          </label>
          <div class="acoes-topo">
            <button class="botao-icone" aria-label="Notificacoes">♢</button>
            <button class="botao-icone" aria-label="Mensagens">✉</button>
              <div class="perfil-topo">
                <span class="foto-perfil"></span>
                <span><a href="login.html">Olá, Usuário!</a></span>
                <span></span>
              </div>
          </div>
        </header>
       
<main class="container mt-4">
<h1 class="mt-4 mb-3">Cadastro de livros </h1>
    <hr>
    <form id="formLivro">
    <div class="mb-3">
      <label for="nome">Nome</label>
       <input type="text" id="nome"
       class="form-control" required>
    </div>
     <div class="mb-3">
      <label for="autor">Autor</label>
       <input type="text" id="autor"
       class="form-control" required>
    </div>
     <div class="mb-3">
      <label for="descricao">Descrição</label>
        <textarea id="descricao"
       class="form-control" required></textarea>
    </div>
     <div class="mb-3">
      <label for="estrelas">Nota</label>
       <input type="number" step="0.1" min="0" max="5" id="estrelas"
       class="form-control" >
    </div>
     <div class="mb-3">
      <label for="classificacao">Classificação</label>
       <input type="text" id="classificacao"
       class="form-control" >
    </div>
     <div class="mb-3">
      <label for="imagem">Imagem</label>
       <input type="text" id="imagem"
       class="form-control" placeholder="url da imagem ou caminho da pasta">
    </div>
    <h3>Obras relacionadas</h3>
    <hr>
    <div class="mb-3">
       <input type="text" id="rel1nome"
       class="form-control" placeholder="Nome da obra 1">
    </div>
    <div class="mb-3" >
    <textarea id="rel1desc" class="form-control"
    placeholder="Descrição obra 1"></textarea>
    </div>
     <div class="mb-3">
      <label for="imagem">Imagem</label>
       <input type="text" id="imagem1"
       class="form-control" placeholder="url da imagem ou caminho da pasta">
    </div>

    <div class="mb-3">
       <input type="text" id="rel2nome"
       class="form-control" placeholder="Nome da obra 2">
    </div>
    <div class="mb-3" >
    <textarea id="rel2desc" class="form-control"
    placeholder="Descrição obra 2"></textarea>
    </div>
     <div class="mb-3">
      <label for="imagem">Imagem</label>
       <input type="text" id="imagem2"
       class="form-control" placeholder="url da imagem ou caminho da pasta">
    </div>

    <div class="mb-3">
       <input type="text" id="rel3nome"
       class="form-control" placeholder="Nome da obra 3">
    </div>
    <div class="mb-3" >
    <textarea id="rel3desc" class="form-control"
    placeholder="Descrição obra 3"></textarea>
    </div>
     <div class="mb-3">
      <label for="imagem">Imagem</label>
       <input type="text" id="imagem3"
       class="form-control" placeholder="url da imagem ou caminho da pasta">
    </div>

    <div class="mb-3">
       <input type="text" id="rel4nome"
       class="form-control" placeholder="Nome da obra 4">
    </div>
    <div class="mb-3" >
    <textarea id="rel4desc" class="form-control"
    placeholder="Descrição obra 4"></textarea>
    </div>
     <div class="mb-3">
      <label for="imagem">Imagem</label>
       <input type="text" id="imagem4"
       class="form-control" placeholder="url da imagem ou caminho da pasta">
    </div>

    <button class="btn btn-sucess">
      Salvar Livro
    </button>
    </form>
    <hr>
    <div id="listaCrud"></div>
</main>

        <footer class="rodape">
          <span>© 2024 Travel Sync</span>
          <a href="#">Sobre</a>
          <a href="#">Contato</a>
          <a href="#">Termos de uso</a>
          <a href="#">Privacidade</a>
          <div class="redes-sociais" aria-label="Redes sociais">
            <span>◎</span>
            <span>●</span>
            <span>◆</span>
          </div>
        </footer>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/cadastro_locais.js"></script>
  </body>
</html>
